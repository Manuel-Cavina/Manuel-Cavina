      <rect width="242" height="132" rx="16" fill="#102E46" stroke="#2F6690"/>
      <text x="22" y="36" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#5FA8D3">ESPECIALIZACIÓN</text>
      <text x="22" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#F3E9D2">Data Engineer</text>
      <text x="22" y="92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#F3E9D2">Associate</text>
      <text x="22" y="116" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#A9C6D9">Pipelines y analítica</text>
    </g>
    <g transform="translate(816)">
      <rect width="244" height="132" rx="16" fill="#102E46" stroke="#2F6690"/>
      <text x="22" y="36" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#5FA8D3">ESPECIALIZACIÓN</text>
      <text x="22" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#F3E9D2">Machine Learning</text>
      <text x="22" y="92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#F3E9D2">Engineer Associate</text>
      <text x="22" y="116" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#A9C6D9">ML sobre AWS</text>
