      <text x="22" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#F3E9D2">Cloud Practitioner</text>
      <text x="22" y="98" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#A9C6D9">Fundamentos generales</text>
      <text x="22" y="118" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#A9C6D9">de AWS Cloud</text>
    </g>
    <g transform="translate(272)">
      <rect width="242" height="132" rx="16" fill="#102E46" stroke="#2F6690"/>
      <text x="22" y="36" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#5FA8D3">ARQUITECTURA</text>
      <text x="22" y="67" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#F3E9D2">Solutions Architect</text>
      <text x="22" y="91" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#F3E9D2">Associate</text>
      <text x="22" y="116" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#A9C6D9">Diseño de soluciones</text>
    </g>
