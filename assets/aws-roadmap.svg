<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Roadmap de certificaciones AWS</title>
  <desc id="desc">AI Practitioner en progreso al 40 por ciento, seguida por Cloud Practitioner, Solutions Architect Associate y especializaciones en Data y Machine Learning</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081521"/>
      <stop offset="1" stop-color="#173B57"/>
    </linearGradient>
    <linearGradient id="progress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5FA8D3"/>
      <stop offset="1" stop-color="#F3E9D2"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="500" rx="24" fill="url(#bg)"/>
  <text x="70" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#F3E9D2">AWS CERTIFICATION ROADMAP</text>
  <text x="70" y="102" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#A9C6D9">Ruta de formación en nube, arquitectura, datos e inteligencia artificial</text>

  <g transform="translate(70 140)">
    <rect width="1060" height="114" rx="18" fill="#102E46" stroke="#5FA8D3" stroke-width="2"/>
    <circle cx="50" cy="42" r="22" fill="#5FA8D3"/>
    <text x="50" y="49" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#081521">01</text>
    <text x="88" y="38" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#F3E9D2">AWS Certified AI Practitioner</text>
    <text x="88" y="65" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#A9C6D9">Objetivo actual · En progreso</text>
    <rect x="615" y="36" width="365" height="24" rx="12" fill="#081521"/>
    <rect x="615" y="36" width="146" height="24" rx="12" fill="url(#progress)"/>
    <text x="1000" y="55" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#F3E9D2">40%</text>
    <text x="615" y="88" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#A9C6D9">Fundamentos de IA · GenAI · Bedrock · IA responsable</text>
  </g>

  <path d="M120 254V288H1080" fill="none" stroke="#5FA8D3" stroke-width="3" stroke-dasharray="8 8" opacity=".75"/>

  <g transform="translate(70 302)">
    <g>
      <rect width="242" height="132" rx="16" fill="#102E46" stroke="#F3E9D2"/>
