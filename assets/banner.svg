    <path d="M980 118h86l43 74-43 74h-86l-43-74z" opacity="0.55"/>
    <circle cx="900" cy="80" r="5" fill="#F3E9D2" filter="url(#glow)"/>
    <circle cx="1029" cy="154" r="5" fill="#F3E9D2" filter="url(#glow)"/>
    <circle cx="980" cy="266" r="5" fill="#F3E9D2" filter="url(#glow)"/>
  </g>
  <rect x="74" y="76" width="7" height="194" rx="3.5" fill="url(#accent)"/>
  <text x="112" y="138" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" letter-spacing="5" fill="#A9C6D9">HELLO, I'M</text>
  <text x="108" y="205" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="56" font-weight="700" fill="#F3E9D2">MANUEL CAVINA PELLIS</text>
  <text x="112" y="252" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" fill="#A9C6D9">Ingeniería en Sistemas · Full Stack · Data &amp; AI</text>
  <g transform="translate(112 290)">
    <rect width="202" height="34" rx="17" fill="#F3E9D2" opacity="0.95"/>
    <text x="101" y="23" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#173B57">CÓRDOBA, ARGENTINA</text>
