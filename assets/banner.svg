<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Manuel Cavina Pellis - Full Stack, Data e Inteligencia Artificial</title>
  <desc id="desc">Banner profesional azul y crema</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131F"/>
      <stop offset="0.55" stop-color="#102E46"/>
      <stop offset="1" stop-color="#1E5578"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F3E9D2"/>
      <stop offset="1" stop-color="#5FA8D3"/>
