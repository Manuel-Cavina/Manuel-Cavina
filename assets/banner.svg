    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="380" rx="26" fill="url(#background)"/>
  <circle cx="1090" cy="50" r="180" fill="#5FA8D3" opacity=".1"/>
  <circle cx="1110" cy="330" r="230" fill="#F3E9D2" opacity=".06"/>
