<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Manuel Cavina Pellis</title>
  <desc id="desc">Banner azul y crema para perfil profesional de GitHub</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081521"/>
      <stop offset="0.55" stop-color="#102E46"/>
      <stop offset="1" stop-color="#1E5578"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F3E9D2"/>
      <stop offset="1" stop-color="#5FA8D3"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <circle cx="1060" cy="74" r="155" fill="#5FA8D3" opacity="0.10"/>
  <circle cx="1120" cy="300" r="215" fill="#F3E9D2" opacity="0.06"/>
  <path d="M0 300 C170 238 320 347 500 286 S820 218 1200 292 V360 H0Z" fill="#F3E9D2" opacity="0.07"/>
  <g opacity="0.55" stroke="#5FA8D3" fill="none">
