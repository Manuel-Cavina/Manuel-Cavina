<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc">
  <title id="title">Actividad de GitHub en preparación</title>
  <desc id="desc">Marcador temporal hasta que GitHub Actions genere el gráfico tridimensional</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1B2A"/>
      <stop offset="1" stop-color="#173B57"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="260" rx="22" fill="url(#bg)"/>
  <g transform="translate(95 58)" fill="#5FA8D3">
    <rect x="0" y="82" width="18" height="18" rx="3" opacity=".35"/>
    <rect x="28" y="62" width="18" height="38" rx="3" opacity=".5"/>
    <rect x="56" y="36" width="18" height="64" rx="3" opacity=".7"/>
    <rect x="84" y="12" width="18" height="88" rx="3"/>
    <rect x="112" y="48" width="18" height="52" rx="3" opacity=".65"/>
  </g>
  <text x="290" y="112" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#F3E9D2">Preparando el gráfico 3D</text>
  <text x="290" y="154" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#A9C6D9">GitHub Actions actualizará esta sección automáticamente.</text>
</svg>
